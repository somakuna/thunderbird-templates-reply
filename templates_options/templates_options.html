<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Manage Templates</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #templates-list { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }
        .template-item { padding: 10px; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .template-item:last-child { border-bottom: none; }
        .template-info { display: flex; flex-direction: column; min-width: 0; }
        .template-name { font-weight: bold; }
        .template-preview { font-size: 0.85em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
        button { margin-left: 10px; flex-shrink: 0; }
        html[dir="rtl"] button { margin-left: 0; margin-right: 10px; }

        .editor-toolbar { margin-bottom: 4px; }
        .editor-toolbar button { margin: 0 2px 0 0; min-width: 30px; }
        html[dir="rtl"] .editor-toolbar button { margin: 0 0 0 2px; }
        #template-content {
            border: 1px solid #ccc;
            min-height: 160px;
            max-height: 360px;
            overflow: auto;
            padding: 8px;
            width: 98%;
            margin-bottom: 10px;
            background: #fff;
        }
        #template-content:focus { outline: 2px solid #4a90d9; }
        #template-content:empty::before {
            content: attr(data-placeholder);
            color: #999;
        }
    </style>
</head>
<body>

    <h2>Templates manager</h2>

    <fieldset>
        <legend id="form-legend">New Template</legend>
        <form id="template-form">
            <input type="hidden" id="template-id">

            <label for="template-name">Title:</label><br>
            <input type="text" id="template-name" dir="auto" required style="width: 98%; margin-bottom: 10px;"><br>

            <label>Text:</label>
            <div class="editor-toolbar" role="toolbar" aria-label="Formatting">
                <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
                <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
                <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
                <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">&bull;</button>
                <button type="button" data-cmd="insertOrderedList" title="Numbered list">1.</button>
                <button type="button" data-cmd="createLink" title="Insert link">&#128279;</button>
                <button type="button" data-cmd="removeFormat" title="Clear formatting">&#10006;</button>
            </div>
            <div id="template-content" contenteditable="true" dir="auto"
                 data-placeholder="Write your template text here..."></div>

            <label for="template-dir">Direction:</label>
            <select id="template-dir" style="margin-bottom: 10px;">
                <option value="auto">Auto-detect</option>
                <option value="ltr">Left-to-right (LTR)</option>
                <option value="rtl">Right-to-left (RTL)</option>
            </select><br>

            <button type="submit" id="save-button">Save</button>
            <button type="button" id="cancel-edit" style="display: none;">Discard</button>
        </form>
    </fieldset>

    <h3>Existing Templates</h3>
    <div id="templates-list">
        <p id="no-templates">There is no saved templates.</p>
    </div>

    <h3>Import / Export</h3>
    <div id="import-export">
        <button type="button" id="export-button">Export templates (.json)</button>
        <button type="button" id="import-button">Import templates (.json)</button>
        <input type="file" id="import-file-input" accept="application/json,.json" style="display: none;">
    </div>

    <script src="../shared.js"></script>
    <script src="templates_options.js"></script>
</body>
</html>
